# Cloudflare Worker config for PortfolioGuidance.
# Deploy with:  npx wrangler deploy   (run from this worker/ folder)

name = "portfolioguidance"
main = "worker.js"
compatibility_date = "2024-11-01"

# Public (non-secret) variables. Edit APP_URL to YOUR GitHub Pages URL and
# KITE_API_KEY to the api_key from your Kite Connect app.
[vars]
APP_URL = "https://rajkumarpattabi.github.io/portfolioguidance/"
KITE_API_KEY = "PASTE_YOUR_KITE_API_KEY"

# KV namespace that stores the daily Kite session. Create it once with:
#   npx wrangler kv namespace create SESSION
# then paste the returned id below.
[[kv_namespaces]]
binding = "SESSION"
id = "PASTE_KV_NAMESPACE_ID"

# Secrets are NOT stored here. Set them once (they're encrypted by Cloudflare):
#   npx wrangler secret put KITE_API_SECRET
#   npx wrangler secret put APP_KEY
# APP_KEY is any random pass-phrase you choose; you'll type it into the app once.
